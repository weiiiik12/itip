<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Game - ITIP 1.0</title>
    <style>
        /* 鎖死 Body，絕對禁止任何捲軸出現 */
        body { background-color: #141e30; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; color: white;}
        
        .game-header { background: rgba(0, 0, 0, 0.5); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; border-bottom: 2px solid #333;}
        .back-btn { padding: 8px 15px; border-radius: 20px; border: none; background: rgba(255,255,255,0.2); color: white; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .back-btn:hover { background: rgba(255,255,255,0.4); }

        /* 回合指示器 */
        #turn-indicator {
            text-align: center; padding: 10px; font-size: 24px; font-weight: 900; 
            background: rgba(0,0,0,0.3); letter-spacing: 1px; transition: all 0.3s ease; flex-shrink: 0;
        }
        .turn-red { color: #ff4757; text-shadow: 0 0 10px rgba(255, 71, 87, 0.5); }
        .turn-blue { color: #1e90ff; text-shadow: 0 0 10px rgba(30, 144, 255, 0.5); }

        /* 記憶時間專屬頂部橫幅 */
        #memory-banner {
            display: none; background: #ff4757; color: white; text-align: center; 
            padding: 10px; font-size: 24px; font-weight: 900; letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.5); z-index: 9; flex-shrink: 0;
        }

        /* 遊戲區域 */
        #game-area { 
            flex-grow: 1; 
            padding: 12px 20px; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative;
            box-sizing: border-box;
        }
        
        /* 網格系統 */
        .memory-grid {
            display: grid;
            gap: 10px;
            width: 100%;
            height: 100%; 
            max-width: 1600px;
            box-sizing: border-box;
            perspective: 1000px; /* 3D 視角移到最外層 */
        }

        /* 🃏 3D 卡片外層容器 (負責縮放與半透明) */
        .memory-card {
            width: 100%;
            height: 100%;
            min-height: 0; min-width: 0;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* 🃏 3D 卡片內層夾心 (專心負責 180 度翻轉，徹底防呆) */
        .memory-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d; /* Safari 救星 */
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            -webkit-transition: -webkit-transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .memory-card.flipped { pointer-events: none !important; }
        .memory-card.flipped .memory-inner { 
            transform: rotateY(180deg); 
            -webkit-transform: rotateY(180deg);
        }
        
        .memory-card.matched { 
            transform: scale(0.95); 
            opacity: 0.6; 
            pointer-events: none !important; 
        }

        .memory-front, .memory-back {
            position: absolute; 
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden; 
            -webkit-backface-visibility: hidden; /* Safari 救星 */
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            font-size: clamp(16px, 2.5vw, 24px); font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); padding: 5px; box-sizing: border-box; text-align: center;
        }
        
        .memory-front { 
            background: linear-gradient(135deg, #1cb5e0, #000851); border: 2px solid #4facfe; color: rgba(255,255,255,0.8); font-size: 40px;
            transform: rotateY(0deg); -webkit-transform: rotateY(0deg);
        }
        .memory-back { 
            background: #1e272e; border: 2px solid #f1c40f; color: white;
            transform: rotateY(180deg); -webkit-transform: rotateY(180deg);
        }
        
        .memory-back img { max-width: 85%; max-height: 85%; object-fit: contain; pointer-events: none; border-radius: 8px;}

        /* 設定彈窗 */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; display:flex; flex-direction:column; justify-content:center; align-items:center; color: #333; }
        .setup-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); width: 90%; max-width: 400px; text-align: left; }
        select { width: 100%; padding: 12px; margin-bottom: 20px; font-size: 16px; border-radius: 8px; }
        .start-btn { width: 100%; padding: 15px; font-size: 20px; background: #ff4757; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(255,71,87,0.4); }
        
    </style>
</head>
<body>

    <div id="setup-screen" class="modal">
        <div class="setup-box">
            <h2 style="margin-top:0; text-align: center;">🧠 記憶翻牌設定 🧠</h2>
            <p style="color:#555; text-align:center;">將自動載入全部單字進行挑戰！</p>
            <label style="display:block; font-weight:bold;">尋找配對 (A)：</label>
            <select id="type-a">
                <option value="english">英文</option>
                <option value="image">圖片</option>
                <option value="chinese">中文</option>
                <option value="audio">聲音 🔊</option>
            </select>
            <label style="display:block; font-weight:bold;">尋找配對 (B)：</label>
            <select id="type-b">
                <option value="chinese">中文</option>
                <option value="image">圖片</option>
                <option value="english">英文</option>
                <option value="audio">聲音 🔊</option>
            </select>
            <button class="start-btn" onclick="startGame()">開始記憶！</button>
        </div>
    </div>

    <div id="game-over-screen" class="modal" style="display:none; color: white;">
        <h1 id="winner-text" style="font-size: 70px; margin-bottom: 10px; text-shadow: 0 5px 20px rgba(255,255,255,0.3);"></h1>
        <p id="win-time" style="font-size: 24px; color: #ccc; margin-bottom: 40px;"></p>
        <button class="start-btn" style="max-width: 300px; background: #1e90ff;" onclick="window.location.href='../index.html?return=games'">返回大廳</button>
        <button class="start-btn" style="max-width: 300px; background: #2ed573; margin-top: 15px;" onclick="location.reload()">再戰一局</button>
    </div>

    <div class="game-header">
        <button class="back-btn" onclick="window.location.href='../index.html?return=games'">⭠ 返回目錄</button>
        <div style="font-size: 20px; font-weight: 900; color: #f1c40f; letter-spacing: 2px;">MEMORY GAME</div>
        
        <div style="display: flex; gap: 20px; font-size: 22px; font-weight: bold; background: rgba(255,255,255,0.1); padding: 5px 20px; border-radius: 15px;">
            <span id="score-red" style="color: #ff4757;">Red: 0</span>
            <span>⚔️</span>
            <span id="score-blue" style="color: #1e90ff;">Blue: 0</span>
        </div>

        <div style="font-weight: bold;">⏳ <span id="timer-display">0</span>s</div>
    </div>
    
    <div id="memory-banner">
        👀 請記住卡片位置... 剩餘 <span id="preview-text">10</span> 秒！
    </div>

    <div id="turn-indicator" class="turn-red" style="display: none;">
        👉 現在輪到：紅隊 (Red Team) 👈
    </div>

    <div id="game-area">
        <div class="memory-grid" id="grid"></div>
    </div>

<script>
    let rawData = JSON.parse(sessionStorage.getItem('itip_current_vocab')) || [];
    if(rawData.length === 0) { alert("找不到單字，請從目錄進入！"); window.history.back(); }
    let vocabList = rawData.filter(item => item.english && item.chinese);
    
    let config = { typeA: 'english', typeB: 'chinese' };
    let hasFlippedCard = false;
    let lockBoard = true; 
    let firstCard, secondCard;
    let matchedPairs = 0;
    let totalPairs = vocabList.length;
    let startTime;
    let gameTimer;
    
    let currentTeam = 'red';
    let scores = { red: 0, blue: 0 };

    function fixPath(url) { return (!url || url.startsWith('http') || url.startsWith('../') || url.startsWith('/')) ? url : '../' + url; }
    
    function getContent(item, type) {
        if(type === 'image') return item.image_URL ? `<img src="${fixPath(item.image_URL)}">` : "無圖";
        if(type === 'english') return item.english_image ? `<img src="${fixPath(item.english_image)}">` : item.english;
        if(type === 'audio') return "🔊"; 
        return item.chinese;
    }

    function speakWord(word) {
        let msg = new SpeechSynthesisUtterance(word); msg.lang = 'en-US'; window.speechSynthesis.speak(msg);
    }

    function calculateOptimalGrid(totalCards) {
        let bestCols = totalCards;
        let bestRows = 1;
        let bestDiff = totalCards;
        
        for (let c = 1; c <= totalCards; c++) {
            if (totalCards % c === 0) {
                let r = totalCards / c;
                if (c >= r) {
                    let diff = c - r;
                    if (diff < bestDiff) {
                        bestDiff = diff;
                        bestCols = c;
                        bestRows = r;
                    }
                }
            }
        }
        return { cols: bestCols, rows: bestRows };
    }

    function startGame() {
        config.typeA = document.getElementById('type-a').value;
        config.typeB = document.getElementById('type-b').value;
        document.getElementById('setup-screen').style.display = 'none';

        scores = { red: 0, blue: 0 };
        currentTeam = 'red';
        updateScoreUI();

        buildGrid();
        startPreviewPhase();
    }

    function updateScoreUI() {
        document.getElementById('score-red').innerText = `Red: ${scores.red}`;
        document.getElementById('score-blue').innerText = `Blue: ${scores.blue}`;
    }

    function updateTurnUI() {
        const indicator = document.getElementById('turn-indicator');
        if (currentTeam === 'red') {
            indicator.className = 'turn-red';
            indicator.innerText = '👉 現在輪到：紅隊 (Red Team) 👈';
        } else {
            indicator.className = 'turn-blue';
            indicator.innerText = '👉 現在輪到：藍隊 (Blue Team) 👈';
        }
    }

    function buildGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        let cardsData = [];

        vocabList.forEach(item => {
            cardsData.push({ pairId: item.english, html: getContent(item, config.typeA), type: config.typeA, fullItem: item });
            cardsData.push({ pairId: item.english, html: getContent(item, config.typeB), type: config.typeB, fullItem: item });
        });

        let totalCards = cardsData.length;
        let optimal = calculateOptimalGrid(totalCards);
        
        grid.style.gridTemplateColumns = `repeat(${optimal.cols}, minmax(0, 1fr))`;
        grid.style.gridTemplateRows = `repeat(${optimal.rows}, minmax(0, 1fr))`;

        cardsData.sort(() => 0.5 - Math.random());

        // 🌟 生成包含「雙層夾心結構」的新卡片
        cardsData.forEach(data => {
            let card = document.createElement('div');
            card.className = 'memory-card';
            card.dataset.pair = data.pairId;
            card.dataset.type = data.type;
            card.innerHTML = `
                <div class="memory-inner">
                    <div class="memory-front">?</div>
                    <div class="memory-back">${data.html}</div>
                </div>
            `;
            card.addEventListener('pointerdown', flipCard);
            grid.appendChild(card);
        });
    }

    function startPreviewPhase() {
        lockBoard = true; 
        const cards = document.querySelectorAll('.memory-card');
        const banner = document.getElementById('memory-banner');
        const text = document.getElementById('preview-text');
        const indicator = document.getElementById('turn-indicator');
        
        cards.forEach(card => card.classList.add('flipped'));
        banner.style.display = 'block'; 
        indicator.style.display = 'none'; 
        
        let countdown = 10; 
        text.innerText = countdown;

        let previewTimer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                text.innerText = countdown;
            } else {
                clearInterval(previewTimer);
                banner.style.display = 'none'; 
                
                cards.forEach(card => card.classList.remove('flipped'));
                
                setTimeout(() => {
                    lockBoard = false; 
                    indicator.style.display = 'block'; 
                    updateTurnUI();
                    startTimer();
                }, 800); 
            }
        }, 1000);
    }

    function startTimer() {
        let seconds = 0;
        const display = document.getElementById('timer-display');
        gameTimer = setInterval(() => {
            seconds++;
            display.innerText = seconds;
        }, 1000);
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flipped');

        if (this.dataset.type === 'audio') {
            let item = vocabList.find(x => x.english === this.dataset.pair);
            if (item && item.audio_URL) {
                try { new Audio(fixPath(item.audio_URL)).play(); } catch(e){}
            } else {
                speakWord(this.dataset.pair); 
            }
        }

        if (!hasFlippedCard) {
            hasFlippedCard = true;
            firstCard = this;
            return;
        }

        secondCard = this;
        checkForMatch();
    }

    function checkForMatch() {
        lockBoard = true; 
        
        let isMatch = firstCard.dataset.pair === secondCard.dataset.pair;
        isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
        try { new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3').play(); } catch(e){}
        
        scores[currentTeam]++;
        updateScoreUI();

        setTimeout(() => {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            resetBoard();
            
            matchedPairs++;
            if (matchedPairs === totalPairs) {
                clearInterval(gameTimer);
                document.getElementById('turn-indicator').style.display = 'none'; 
                setTimeout(() => {
                    let winMsg = "";
                    if (scores.red > scores.blue) winMsg = "<span style='color:#ff4757;'>🎉 紅隊獲勝！🎉</span>";
                    else if (scores.blue > scores.red) winMsg = "<span style='color:#1e90ff;'>🎉 藍隊獲勝！🎉</span>";
                    else winMsg = "<span style='color:#f1c40f;'>🤝 雙方平手！🤝</span>";
                    
                    document.getElementById('winner-text').innerHTML = winMsg;
                    document.getElementById('win-time').innerText = `總共花費：${document.getElementById('timer-display').innerText} 秒`;
                    document.getElementById('game-over-screen').style.display = 'flex';
                }, 500);
            }
        }, 400); 
    }

    function unflipCards() {
        try { new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3').play(); } catch(e){}
        
        setTimeout(() => {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            resetBoard();
            
            currentTeam = (currentTeam === 'red') ? 'blue' : 'red';
            updateTurnUI();
        }, 1200); 
    }

    function resetBoard() {
        [hasFlippedCard, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
    }
</script>
</body>
</html>
